name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          # Login + interactive so ~/.bashrc runs (Ubuntu skips it for non-interactive shells — same env as manual SSH).
          script: bash -ilc 'bash /home/ubuntu/tg-kite/deploy.sh'
